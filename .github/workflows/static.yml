# Workflow to automatically build React Vite app and deploy to GitHub Pages
name: Deploy React App to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Build Vite Production Assets
        run: npm run build:client

      - name: Ensure SPA & GitHub Pages compatibility (.nojekyll & 404)
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v5

      - name: Upload dist Artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



